<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Interpreter browser E2E</title>
  </head>
  <body>
    <script type="module">
      import { FileSystemManager } from "/src/features/artifacts/lib/fs.ts";
      import { executeScript } from "/src/features/artifacts/lib/executeScript.ts";
      import { createDuckDbWorkspace } from "/src/features/artifacts/lib/duckdbWorkspace.ts";
      import { ArtifactReadWriteManager } from "/src/features/artifacts/lib/artifactFileTools.ts";
      import { executeCode } from "/src/features/tools/lib/interpreter.ts";
      import { executeJavaScript } from "/src/features/tools/lib/javascript.ts";
      import { executeBash } from "/src/features/tools/lib/bash.ts";
      import { createSkillsProvider } from "/src/features/skills/lib/skillsProvider.ts";
      import { setSkillResourceResolver } from "/src/features/tools/lib/skillResourceMount.ts";
      import { loadConfig } from "/src/shared/config.ts";
      import { setModel } from "/src/features/tools/lib/llmCommand.ts";

      // Playwright WebKit cannot use the app's OPFS writer. Exercise the same
      // execution/commit boundary with snapshots there; Chromium uses real OPFS.
      function memoryWorkspace() {
        let snapshot = {};
        const fs = {
          getOverlaySnapshot: async () => structuredClone(snapshot),
          applyOverlaySnapshot: async (files) => {
            snapshot = structuredClone(files);
            return { mutations: [], createdPaths: [], updatedPaths: [] };
          },
          withExclusiveAccess: (run) => run(fs),
        };
        return fs;
      }

      window.interpreterE2E = {
        executePython: executeCode,
        executeJavaScript,
        executeBash,
        async runScript(engine, chatId, args, files = {}, resources = {}, plugin) {
          const results = await this.runScripts(
            chatId,
            [{ ...args, ...(engine === "auto" ? {} : { language: engine }) }],
            files,
            resources,
            plugin,
          );
          return results[0];
        },
        async runScripts(chatId, requests, files = {}, resources = {}, plugin) {
          const fs = window.interpreterMemoryWorkspace ? memoryWorkspace() : new FileSystemManager(chatId);
          await fs.applyOverlaySnapshot(files, { deleteMissing: true });
          const providerId = "browser-script-skills";
          createSkillsProvider(
            [
              {
                name: "test-script",
                plugin,
                description: "Browser script fixture",
                loadContent: () => "Run the bundled script.",
                resources: Object.keys(resources),
                loadResource: (path) => resources[path] ?? null,
              },
            ],
            { id: providerId, name: "Script fixture", description: "Script fixture" },
          );
          try {
            const results = [];
            for (const args of requests) {
              const result = await executeScript({ args, context: { chatId }, fs });
              results.push({ ...result, files: await fs.getOverlaySnapshot() });
            }
            return results;
          } finally {
            setSkillResourceResolver(providerId, null);
          }
        },
        executeWorkspace(engine, chatId, code) {
          return executeScript({
            args: { code, language: engine },
            context: { chatId },
            fs: new FileSystemManager(chatId),
          });
        },
        async queryWorkspace(chatId, query) {
          const host = createDuckDbWorkspace(new FileSystemManager(chatId));
          try {
            return await host.query(null, query);
          } finally {
            host.dispose();
          }
        },
        async initializeLlm() {
          await loadConfig();
          setModel("ui-model");
        },
        async runToolFlow(chatId) {
          const fs = new FileSystemManager(chatId);
          const tools = new ArtifactReadWriteManager().createTools(() => fs, { namespace: "artifacts" });
          const invoke = (name, args) =>
            tools.find((tool) => tool.name === name).function(args, { runId: "browser-run" });
          const created = await invoke("artifacts_create", {
            file_path: "/bom.txt",
            content: "\uFEFFalpha\r\nbeta\r\n",
          });
          const edited = await invoke("artifacts_edit", {
            edits: [{ file_path: "/bom.txt", old_string: "alpha", new_string: "ALPHA" }],
          });
          const read = await invoke("artifacts_read", { file_path: "/bom.txt" });
          const listed = await invoke("artifacts_glob", { pattern: "{missing.txt,**/*}" });
          return { created, edited, read, listed, file: await fs.getFile("/bom.txt") };
        },
        async runArtifactFlow(chatId) {
          const fs = new FileSystemManager(chatId);
          await fs.createFile("/input.txt", "hello from opfs", "text/plain");
          const files = await fs.getOverlaySnapshot();
          const execution = await executeCode({
            code: `from pathlib import Path\ntext = Path("input.txt").read_text()\nPath("output.txt").write_text(text.upper())\nprint(text)`,
            files,
          });
          if (!execution.success || !execution.files) return { execution };
          const commit = await fs.applyOverlaySnapshot(execution.files, { deleteMissing: true });
          return {
            execution,
            commit,
            output: await fs.getFile("/output.txt"),
          };
        },
      };
    </script>
  </body>
</html>
